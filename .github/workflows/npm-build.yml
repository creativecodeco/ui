name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Clean and Install
        run: npm ci --ignore-scripts

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Lint and Format Check
        run: npm run lint && npm run format:check

      - name: TypeScript Check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:action

      - name: Jest coverage comment
        uses: MishaKav/jest-coverage-comment@7032bf8e71aa2b267b6b143be3c4480b625c2b12 # v1.0.38
        with:
          coverage-summary-path: ./coverage/coverage-summary.json
          title: Pull Request Coverage - By CreativeCode.com.co
          summary-title: Pull Request Summary
          badge-title: Coverage
          hide-comment: false
          create-new-comment: false
          hide-summary: false
          junitxml-title: Tests Details
          junitxml-path: ./junit.xml
          coverage-title: Coverage by file
          coverage-path: ./coverage.txt
